<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nuestro Universo</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-overlay" class="page-layer active">
        <div class="login-card">
            <h1>Nuestro Universo</h1>
            <p>Anıl & Camila</p>
            <div class="user-selection">
                <button onclick="loginUser('anil')">🤵 Soy Anıl</button>
                <button onclick="loginUser('camila')">👸 Soy Camila</button>
            </div>
        </div>
    </div>

    <div id="main-page" class="page-layer">
        <div class="glass-card">
            <div class="heart-container">
                <div class="heart-shape">
                    <img src="" id="album-photo" alt="Nuestro Momento">
                </div>
            </div>

            <div id="counter" class="counter-grid"></div>

            <div class="info-row">
                <div class="info-item">
                    <span class="city">☀️ Milan</span>
                    <span id="m-temp" class="temp">--°C</span>
                    <span id="m-time" class="time">00:00</span>
                </div>
                <div class="info-item">
                    <span class="city">☀️ Bogotá</span>
                    <span id="b-temp" class="temp">--°C</span>
                    <span id="b-time" class="time">00:00</span>
                </div>
            </div>

            <p class="quote">"No sé hacia dónde vamos, pero me gusta el camino."</p>

            <div class="actions">
                <button class="btn-primary" onclick="goToUniverse()">✨ Nuestro Universo (Juego)</button>
                <button class="btn-secondary" onclick="triggerUpload()">📸 Subir Nuestro Momento</button>
                <input type="file" id="photo-input" style="display:none" accept="image/*" onchange="uploadPhoto(event)">
            </div>
        </div>
    </div>

    <div id="game-page" class="page-layer">
        <div class="glass-card">
            <button class="back-btn" onclick="goToHome()">← Volver</button>
            <h2 id="game-status">Cargando...</h2>
            <div id="tic-tac-toe-grid"></div>
            <button class="reset-btn" onclick="clearBoard()">Reset</button>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
