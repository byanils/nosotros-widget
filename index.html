<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nuestro Universo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-overlay" class="page-layer active">
        <div class="login-card">
            <h1>Nuestro Universo</h1>
            <p>Anıl & Camila</p>
            <div class="user-selection">
                <button onclick="loginUser('anil')">🤵 Soy Anıl</button>
                <button onclick="loginUser('camila')">👸 Soy Camila</button>
            </div>
        </div>
    </div>

    <div id="main-page" class="page-layer">
        <div class="glass-card">
            <div class="top-info">
                <span id="m-time">00:00</span>
                <span id="m-temp">--°C</span>
            </div>

            <div class="heart-container" onclick="nextPhoto()">
                <div class="heart-shape">
                    <img src="foto1.jpg" id="album-photo">
                </div>
            </div>

            <div id="counter" class="counter-grid"></div>

            <div class="selfie-slots">
                <div class="slot">
                    <small>Anıl</small>
                    <div class="slot-img" id="slot-anil">📸</div>
                </div>
                <div class="slot">
                    <small>Camila</small>
                    <div class="slot-img" id="slot-camila">📸</div>
                </div>
            </div>

            <div class="actions">
                <button class="btn-primary" onclick="goToUniverse()">✨ Nuestro Universo (Juego)</button>
                <button class="btn-secondary" onclick="triggerUpload()">📸 Subir Nuestro Momento</button>
                <input type="file" id="photo-input" style="display:none" accept="image/*" onchange="uploadPhoto(event)">
            </div>
        </div>
    </div>

    <div id="game-page" class="page-layer">
        <div class="glass-card">
            <button class="back-btn" onclick="goToHome()">← Volver</button>
            
            <div class="adventure-row" id="chest-container">
                </div>

            <h3 id="game-status">Turno de: --</h3>
            <div id="tic-tac-toe-grid"></div>
            <button class="reset-btn" onclick="clearBoard()">Reset</button>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
