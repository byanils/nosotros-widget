<body>
    <div id="stars-container"></div>

    <div id="main-page" class="page-layer active">
        <div class="glass-card">
            <div class="info-header">
                <span id="milan-time">05:11</span>
                <span id="milan-temp">9.7°C</span>
            </div>

            <div class="heart-shape"><img id="album-photo" src="foto1.jpg"></div>

            <div id="counter">
                </div>

            <p class="romantic-text">No sé hacia dónde vamos, pero me gusta el camino.</p>

            <button class="btn-nav primary" onclick="goToUniverse()">✨ Nuestro Universo</button>
            <button class="btn-nav secondary" onclick="openPhotoModal()">📸 Nuestro Momento</button>
        </div>
    </div>

    <div id="star-map-page" class="page-layer">
        <div class="glass-card">
            <button onclick="goToHome()" style="background:none; border:none; color:white; align-self:start;">← Volver</button>
            <h3 style="font-size:1rem; margin-bottom:10px;">Nuestra Aventura</h3>
            
            <div class="vault-area">
                <div class="vault-line"></div>
                <div id="vault-grid"></div>
            </div>

            <div id="tic-tac-toe-grid"></div>
            <div id="game-status" style="font-size:0.7rem; color:var(--primary);">Turno de...</div>
            <button onclick="clearBoard()" style="font-size:0.6rem; opacity:0.5; background:none; color:white; border:none;">Reset</button>
        </div>
    </div>
</body>
