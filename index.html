<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nuestro Universo</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="stars-container"></div>

    <div id="login-overlay" class="page-layer active">
        <div class="glass-card">
            <h2>¿Quién eres hoy? ❤️</h2>
            <div class="login-btns">
                <button class="btn-login" onclick="loginUser('anil')">Soy Anıl</button>
                <button class="btn-login" onclick="loginUser('camila')">Soy Camila</button>
            </div>
        </div>
    </div>

    <div id="main-page" class="page-layer">
        <div class="glass-card main-card">
            <div class="heart-box">
                <div class="heart-shape">
                    <img id="album-photo" src="foto1.jpg">
                </div>
            </div>
            
            <div id="counter"></div>

            <div class="weather-clock-row">
                <div class="city-box">
                    <span id="milan-icon">☀️</span>
                    <span class="city-name">Milan</span>
                    <span id="milan-temp">--°</span>
                    <span id="milan-time">00:00</span>
                </div>
                <div class="city-box">
                    <span id="bogota-icon">☀️</span>
                    <span class="city-name">Bogotá</span>
                    <span id="bogota-temp">--°</span>
                    <span id="bogota-time">00:00</span>
                </div>
            </div>

            <div id="message"></div>
            
            <div class="main-nav">
                <button class="btn-nav primary" onclick="goToUniverse()">✨ Nuestro Universo</button>
                <button class="btn-nav secondary" onclick="openPhotoModal()">📸 Nuestro Momento</button>
            </div>
        </div>
    </div>

    <div id="star-map-page" class="page-layer map-layer">
        <button id="back-btn" onclick="goToHome()">← Volver</button>
        <div id="vault-container"></div>
    </div>

    <div id="photo-daily-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closePhotoModal()">&times;</span>
            <h3>Nuestro Momento 📸</h3>
            <p id="photo-status-msg">Sube tu foto de hoy</p>
            <div class="photo-grid">
                <div class="photo-item">
                    <p>Anıl</p>
                    <div class="frame"><img id="img-anil" src="placeholder.png" class="locked"></div>
                </div>
                <div class="photo-item">
                    <p>Camila</p>
                    <div class="frame"><img id="img-camila" src="placeholder.png" class="locked"></div>
                </div>
            </div>
            <input type="file" id="photo-input" hidden accept="image/*" onchange="uploadSelfie(this)">
            <button class="upload-btn" onclick="document.getElementById('photo-input').click()">Subir Mi Foto</button>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
