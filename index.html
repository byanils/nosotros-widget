<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nuestro Universo</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="stars-container"></div>

    <div id="login-overlay" class="page-layer active">
        <div class="glass-card login-card main-ui-size">
            <h1>Nuestro Universo</h1>
            <p class="subtitle">Anıl & Camila</p>
            <div class="login-options">
                <button class="user-btn" onclick="loginUser('anil')">🤵 Soy Anıl</button>
                <button class="user-btn" onclick="loginUser('camila')">👸 Soy Camila</button>
            </div>
        </div>
    </div>

    <div id="main-page" class="page-layer">
        <div class="glass-card main-ui-size">
            <div class="top-bar">
                <span id="milan-time" class="time-header">00:00</span>
                <span id="milan-temp" class="temp-header">--°C</span>
            </div>
            
            <div class="heart-container">
                <div class="heart-shape"><img id="album-photo" src="foto1.jpg"></div>
            </div>

            <div id="counter"></div>
            
            <p id="message" class="romantic-text"></p>

            <div class="main-nav">
                <button class="btn-nav primary" onclick="goToUniverse()">✨ Nuestro Universo</button>
                <button class="btn-nav secondary" onclick="openPhotoModal()">📸 Nuestro Momento</button>
            </div>
        </div>
    </div>

    <div id="star-map-page" class="page-layer">
        <div class="glass-card main-ui-size">
            <button id="back-btn" onclick="goToHome()">← Volver</button>
            <h2 class="section-title">Nuestra Aventura</h2>

            <div class="vault-container">
                <div class="progress-line"></div>
                <div id="vault-grid"></div>
            </div>

            <div class="game-section">
                <div class="score-board">
                    <p>Anıl (X): <span id="score-anil">0</span></p>
                    <p>Camila (O): <span id="score-camila">0</span></p>
                </div>
                <div id="tic-tac-toe-grid"></div>
                <p id="game-status">Esperando...</p>
                <button class="reset-btn" onclick="clearBoard()">Reset</button>
            </div>
        </div>
    </div>

    <div id="photo-daily-modal" class="modal">
        <div class="glass-card modal-content">
            <span class="close" onclick="closePhotoModal()">&times;</span>
            <h3>Nuestro Momento</h3>
            <div class="photo-grid">
                <div class="photo-item"><span>Anıl</span><div class="frame"><img id="img-anil" src="placeholder.png" class="locked"></div></div>
                <div class="photo-item"><span>Camila</span><div class="frame"><img id="img-camila" src="placeholder.png" class="locked"></div></div>
            </div>
            <input type="file" id="photo-input" hidden accept="image/*" onchange="uploadSelfie(this)">
            <button class="upload-btn" onclick="document.getElementById('photo-input').click()">Subir Mi Foto</button>
            <p id="photo-status-msg"></p>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
