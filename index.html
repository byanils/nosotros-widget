<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestro Universo</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="main-page" class="page-layer active">
        <div class="container">
            <div class="heart-container">
                <img id="album-photo" src="foto1.jpg" alt="Nosotros">
            </div>
            <div id="counter"></div>
            <div id="message">Cargando amor...</div>

            <div id="star-portal" onclick="goToUniverse()">
                <span class="portal-star">✨</span>
                <p class="portal-text">Nuestro Universo</p>
            </div>
        </div>
    </div>

    <div id="star-map-page" class="page-layer">
        <button id="back-btn" onclick="goToHome()">← Volver</button>
        <div id="stars-container"></div>
        <div class="star-content">
            <div class="city-star" id="milan-star">📍 Milán</div>
            <div id="plane-container">
                <div id="plane">✈️</div>
            </div>
            <div class="city-star" id="bogota-star">📍 Bogotá</div>
            <div id="vault-container"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
