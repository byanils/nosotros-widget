<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestro Universo | Anıl & Camila</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="login-overlay" class="page-layer active">
        <div class="login-box">
            <h2>¿Quién eres? ❤️</h2>
            <button onclick="loginUser('anil')">Soy Anıl</button>
            <button onclick="loginUser('camila')">Soy Camila</button>
        </div>
    </div>

    <div id="main-page" class="page-layer">
        <div class="container">
            
            <div id="photo-daily-modal" class="modal">
                <div class="modal-content">
                    <span class="close" onclick="closePhotoModal()">&times;</span>
                    <h3>Quitapenas Diario 📸</h3>
                    <p id="photo-status-msg">Cargando estado...</p>
                    <div class="photo-display">
                        <div class="photo-slot">
                            <p>Anıl</p>
                            <img id="img-anil" src="https://via.placeholder.com/150?text=Bloqueado" class="locked">
                        </div>
                        <div class="photo-slot">
                            <p>Camila</p>
                            <img id="img-camila" src="https://via.placeholder.com/150?text=Bloqueado" class="locked">
                        </div>
                    </div>
                    <input type="file" id="photo-input" accept="image/*" style="display:none" onchange="uploadSelfie(this)">
                    <button class="upload-btn" onclick="document.getElementById('photo-input').click()">Subir mi Selfie</button>
                </div>
            </div>

            <div class="heart-container">
                <img id="album-photo" src="foto1.jpg" alt="Nosotros">
            </div>
            
            <div id="counter"></div>

            <div class="status-board">
                <div class="status-card">
                    <span class="city-name">Milán</span>
                    <span id="milan-time" class="city-time">00:00</span>
                    <span id="milan-temp" class="city-weather">--°C</span>
                </div>
                <div class="status-divider">✈️</div>
                <div class="status-card">
                    <span class="city-name">Bogotá</span>
                    <span id="bogota-time" class="city-time">00:00</span>
                    <span id="bogota-temp" class="city-weather">--°C</span>
                </div>
            </div>

            <div id="message">Eres mi notificación favorita.</div>
            
            <div class="action-buttons">
                <div class="btn-nav" onclick="goToUniverse()">✨ Nuestro Universo</div>
                <div class="btn-nav" onclick="openPhotoModal()">📸 Quitapenas</div>
            </div>
        </div>
    </div>

    <div id="star-map-page" class="page-layer">
        <button id="back-btn" onclick="goToHome()">← Volver</button>
        <div id="stars-container"></div>
        <div id="star-content">
            <div class="city-star" id="milan-star">📍 Milán</div>
            <div id="plane-container"><div id="plane">✈️</div></div>
            <div id="vault-container">
                </div>
            <div class="city-star" id="bogota-star">📍 Bogotá</div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
