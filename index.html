<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nuestro Universo</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="stars-container"></div>

    <div id="login-overlay" class="page-layer active">
        <div class="glass-card main-ui">
            <h1 class="hero-title">Nuestro Universo</h1>
            <p class="hero-subtitle">Anıl & Camila</p>
            <div class="login-options">
                <button class="user-btn" onclick="loginUser('anil')">🤵 Soy Anıl</button>
                <button class="user-btn" onclick="loginUser('camila')">👸 Soy Camila</button>
            </div>
        </div>
    </div>

    <div id="main-page" class="page-layer">
        <div class="glass-card main-ui">
            <div class="heart-container" onclick="triggerUpload()">
                <div class="heart-shape">
                    <img src="placeholder.jpg" id="album-photo">
                    <div class="photo-overlay">📸</div>
                </div>
                <input type="file" id="photo-input" style="display:none" onchange="uploadPhoto(event)">
            </div>

            <div id="counter" class="grid-layout"></div>

            <div class="info-grid">
                <div class="info-box">
                    <span class="label">Milan</span>
                    <span id="m-temp" class="val">--°C</span>
                    <span id="m-time" class="sub-val">00:00</span>
                </div>
                <div class="info-box">
                    <span class="label">Bogotá</span>
                    <span id="b-temp" class="val">--°C</span>
                    <span id="b-time" class="sub-val">00:00</span>
                </div>
            </div>

            <p id="message" class="romantic-quote"></p>

            <div class="nav-stack">
                <button class="btn-primary" onclick="goToUniverse()">✨ Nuestro Universo</button>
            </div>
        </div>
    </div>

    <div id="star-map-page" class="page-layer">
        <div class="glass-card main-ui">
            <div class="header-row">
                <button class="back-link" onclick="goToHome()">← Volver</button>
                <h3>Nuestra Aventura</h3>
            </div>
            
            <div class="vault-track">
                <div class="line"></div>
                <div id="vault-grid"></div>
            </div>

            <div class="game-container">
                <div class="game-header">
                    <span>X: <b id="score-anil">0</b></span>
                    <span id="game-status">Turno...</span>
                    <span>O: <b id="score-camila">0</b></span>
                </div>
                <div id="tic-tac-toe-grid"></div>
                <button class="reset-link" onclick="clearBoard()">Reiniciar Juego</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
