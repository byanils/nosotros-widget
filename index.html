<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nuestro Universo | Anıl & Camila</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="stars-container"></div>

    <div id="login-overlay" class="page-layer active">
        <div class="glass-card login-card">
            <div class="login-icon">✨</div>
            <h2>¿Quién eres hoy?</h2>
            <p>Bienvenido a nuestro rincón eterno</p>
            <div class="login-btns">
                <button class="btn-login" onclick="loginUser('anil')">Soy Anıl</button>
                <button class="btn-login" onclick="loginUser('camila')">Soy Camila</button>
            </div>
        </div>
    </div>

    <div id="main-page" class="page-layer">
        <div class="glass-card main-card">
            <div class="heart-box">
                <div class="heart-shape">
                    <img id="album-photo" src="foto1.jpg" onerror="this.src='https://images.unsplash.com/photo-1518199266791-5375a83190b7?q=80&w=500'">
                </div>
            </div>
            
            <div id="counter"></div>
            <div id="message">Conectando con nuestro tiempo...</div>
            
            <div class="main-nav">
                <button class="btn-nav primary" onclick="goToUniverse()">✨ Nuestro Universo</button>
                <button class="btn-nav secondary" onclick="openPhotoModal()">📸 Nuestro Momento</button>
            </div>
        </div>
    </div>

    <div id="star-map-page" class="page-layer">
        <button id="back-btn" onclick="goToHome()">← Volver al Inicio</button>
        <div id="vault-scroll-container">
            <div id="vault-container"></div>
        </div>
    </div>

    <div id="photo-daily-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closePhotoModal()">&times;</span>
            <h3>Nuestro Momento</h3>
            <p id="photo-status-msg">Sube tu foto de hoy para desbloquear el recuerdo</p>
            <div class="photo-display">
                <div class="photo-slot">
                    <span>Anıl</span>
                    <div class="img-frame"><img id="img-anil" src="https://via.placeholder.com/150?text=Kilitli" class="locked"></div>
                </div>
                <div class="photo-slot">
                    <span>Camila</span>
                    <div class="img-frame"><img id="img-camila" src="https://via.placeholder.com/150?text=Kilitli" class="locked"></div>
                </div>
            </div>
            <input type="file" id="photo-input" style="display:none" accept="image/*" onchange="uploadSelfie(this)">
            <button class="upload-button" onclick="document.getElementById('photo-input').click()">Subir Mi Foto</button>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
