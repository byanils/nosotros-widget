<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestro Universo</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Giriş Ekranı -->
    <div id="login-screen" class="login-overlay active">
        <div class="login-card">
            <h2>¿Quién eres? ✨</h2>
            <div class="login-options">
                <button onclick="login('Anıl')">Anıl</button>
                <button onclick="login('Camila')">Camila</button>
            </div>
        </div>
    </div>

    <div id="main-page" class="page-layer">
        <div class="container">
            <div class="heart-container">
                <img id="album-photo" src="foto1.jpg" alt="Nosotros">
            </div>
            
            <div id="counter"></div>

            <div class="status-board">
                <div class="status-card">
                    <span class="city-name">Milán</span>
                    <span id="milan-time" class="city-time">00:00</span>
                    <span id="milan-temp" class="city-weather">--°C</span>
                </div>
                <div class="status-divider">✈️</div>
                <div class="status-card">
                    <span class="city-name">Bogotá</span>
                    <span id="bogota-time" class="city-time">00:00</span>
                    <span id="bogota-temp" class="city-weather">--°C</span>
                </div>
            </div>

            <div id="message">Cargando...</div>
            
            <!-- Selfie Butonu -->
            <div id="selfie-portal" onclick="openSelfie()">
                <span class="portal-star">📸</span>
                <p class="portal-text">Daily Selfie</p>
            </div>

            <div id="star-portal" onclick="goToUniverse()">
                <span class="portal-star">✨</span>
                <p class="portal-text">Nuestro Universo</p>
            </div>
        </div>
    </div>

    <div id="star-map-page" class="page-layer">
        <button id="back-btn" onclick="goToHome()">← Volver</button>
        <div id="stars-container"></div>
        <div id="star-content">
            <div class="city-star" id="milan-star">📍 Milán</div>
            <div id="plane-container"><div id="plane">✈️</div></div>
            <div id="vault-container"></div>
            <div class="city-star" id="bogota-star">📍 Bogotá</div>
        </div>
    </div>

    <!-- Selfie Ekranı -->
    <div id="selfie-page" class="page-layer">
        <button id="selfie-back-btn" onclick="closeSelfie()">← Volver</button>
        <div class="selfie-container">
            <h3>Nuestros Momentos 🤳</h3>
            <p id="reset-info" class="reset-text"></p>
            
            <div class="selfie-grid">
                <div class="selfie-box" id="anil-selfie-box">
                    <span>Anıl</span>
                    <div class="photo-wrapper">
                        <img id="anil-photo" src="" alt="Anıl Selfie" class="blurred">
                        <div id="anil-placeholder" class="placeholder">No photo yet</div>
                    </div>
                </div>
                <div class="selfie-box" id="camila-selfie-box">
                    <span>Camila</span>
                    <div class="photo-wrapper">
                        <img id="camila-photo" src="" alt="Camila Selfie" class="blurred">
                        <div id="camila-placeholder" class="placeholder">No photo yet</div>
                    </div>
                </div>
            </div>

            <div id="upload-section">
                <input type="file" id="selfie-input" accept="image/*" style="display: none;">
                <button id="upload-btn" onclick="document.getElementById('selfie-input').click()">Subir mi foto de hoy</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
