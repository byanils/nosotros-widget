<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestro Camino</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" id="main-page">
        <div class="heart-container">
            <img id="album-photo" src="foto1.jpg" alt="Nosotros">
        </div>
        <div id="counter"></div>
        <div id="message">Cargando amor...</div>

        <div id="star-portal" onclick="openStarMap()">
            <span class="portal-star">✨</span>
            <p class="portal-text">Nuestro Universo</p>
        </div>
    </div>

    <div id="star-map-page" class="hidden">
        <button id="back-btn" onclick="closeStarMap()">← Volver</button>
        
        <div id="stars-container"></div>

        <div class="star-content">
            <div class="city-star" id="milan-star">📍 Milán</div>
            <div id="plane">✈️</div> 
            <div class="connection-line"></div>
            <div class="city-star" id="bogota-star">📍 Bogotá</div>
            
            <div id="vault-container"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
